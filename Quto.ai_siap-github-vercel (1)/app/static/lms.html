<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#163b3a" />
    <title>Quto LMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #163b3a;
        --blue: #167d72;
        --mint: #d7f1eb;
        --paper: #f5f7f6;
        --surface: #fff;
        --card-surface: #ddf1e5;
        --card-border: #b4d9c3;
        --dashboard-card-surface: #e2eef7;
        --dashboard-card-border: #b5cfe1;
        --dashboard-card-sage: #e1f0e2;
        --dashboard-card-sage-border: #b7d4ba;
        --dashboard-card-peach: #ffeadf;
        --dashboard-card-peach-border: #dfbca9;
        --ink: #1f2933;
        --muted: #667085;
        --line: #e4e9e7;
        --orange: #f2b84b;
        --soft: #edf5f2;
        --focus-ring: rgba(22, 125, 114, 0.13);
        --danger: #b9383f;
        --danger-soft: #fff0ef;
        --danger-line: #f1c8c5;
        --shadow: 0 18px 50px rgba(22, 59, 58, 0.09);
      }

      [data-theme="dark"] {
        --navy: #102b2a;
        --blue: #55c6b5;
        --mint: #1a4140;
        --paper: #10201f;
        --surface: #192d2c;
        --card-surface: #192d2c;
        --card-border: #304443;
        --dashboard-card-surface: #203743;
        --dashboard-card-border: #365565;
        --dashboard-card-sage: #243d32;
        --dashboard-card-sage-border: #41694f;
        --dashboard-card-peach: #44352c;
        --dashboard-card-peach-border: #72533f;
        --ink: #edf6f5;
        --muted: #aec1be;
        --line: #304443;
        --orange: #f2bd58;
        --soft: #203b3a;
        --focus-ring: rgba(85, 198, 181, 0.18);
        --danger: #ff9d9d;
        --danger-soft: #4b2428;
        --danger-line: #7d4245;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.24);
      }

      [data-theme="dark"] .hero-board small {
        color: #d5eaec;
      }
      [data-theme="dark"] .login-copy p {
        color: #d7eef2;
      }
      [data-theme="dark"] .login-note {
        color: #c2d8dd;
      }
      [data-theme="dark"] .auth-switch {
        background: var(--soft);
      }
      [data-theme="dark"] .auth-switch button.active {
        color: var(--ink);
      }
      [data-theme="dark"] .eye-button:hover {
        background: var(--soft);
      }
      [data-theme="dark"] .btn.secondary {
        color: #f2fbfb;
        background: var(--soft);
      }
      [data-theme="dark"] .btn.danger {
        color: #ffd4d4;
        background: #4b2428;
      }
      [data-theme="dark"] .error {
        background: var(--danger-soft);
        border-color: var(--danger-line);
      }
      [data-theme="dark"] .profile small {
        color: #c4dadd;
      }
      [data-theme="dark"] .stat strong,
      [data-theme="dark"] .result {
        color: var(--ink);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font:
          15px/1.55 "DM Sans",
          sans-serif;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      h1,
      h2,
      h3,
      .brand {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 3.8rem);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }
      h2 {
        line-height: 1.15;
      }
      h3 {
        font-size: 1.05rem;
      }
      .landing {
        min-height: 100vh;
        background: var(--paper);
      }
      .landing-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px clamp(18px, 6vw, 90px);
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .nav-link {
        padding: 9px 13px;
        color: var(--navy);
        background: none;
        border: 0;
        font-weight: 700;
      }
      .theme-toggle {
        display: inline-grid;
        place-items: center;
        width: 48px;
        height: 48px;
        padding: 0;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 50%;
        font-size: 1.1rem;
      }
      .theme-toggle:hover {
        color: var(--blue);
        border-color: var(--blue);
      }
      .theme-toggle svg,
      .eye-button svg,
      .icon-text-btn svg {
        display: block;
        flex: 0 0 auto;
      }
      .floating-theme-toggle {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 20;
        box-shadow: 0 10px 28px rgba(16, 42, 67, .2);
      }
      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
        gap: 60px;
        align-items: center;
        width: min(1180px, calc(100% - 36px));
        margin: 0 auto;
        padding: clamp(55px, 9vw, 110px) 0 80px;
      }
      .hero-copy p {
        max-width: 570px;
        margin: 22px 0 30px;
        color: var(--muted);
        font-size: 1.12rem;
      }
      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .dashboard-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: -8px 0 20px;
      }
      .dashboard-search {
        width: min(100%, 320px);
      }
      .filter-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .filter-tab {
        padding: 8px 11px;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 0.86rem;
        font-weight: 700;
      }
      .filter-tab.active,
      .filter-tab:hover {
        color: var(--blue);
        background: var(--mint);
        border-color: var(--blue);
      }
      .muted {
        color: var(--muted);
      }
      .hero-art {
        position: relative;
        min-height: 390px;
        padding: 35px;
        background: var(--navy);
        border-radius: 38px;
        overflow: hidden;
      }
      .hero-art::before,
      .hero-art::after {
        content: "•"; 
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
      }
      .hero-art::before {
        width: 360px;
        height: 360px;
        right: -150px;
        top: -150px;
      }
      .hero-art::after {
        width: 270px;
        height: 270px;
        left: -145px;
        bottom: -145px;
      }
      .hero-board {
        position: relative;
        z-index: 1;
        min-height: 298px;
        padding: 32px 27px 28px;
        color: #fff;
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 23px;
      }
      .hero-board header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 45px;
      }
      .hero-board small {
        color: #bad0d5;
        font-size: 1rem;
      }
      .hero-bars {
        display: grid;
        gap: 18px;
      }
      .hero-bar {
        height: 18px;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 99px;
      }
      .hero-bar i {
        display: block;
        height: 100%;
        background: var(--orange);
        border-radius: inherit;
      }
      .hero-bar:nth-child(1) i {
        width: 82%;
      }
      .hero-bar:nth-child(2) i {
        width: 64%;
        background: var(--mint);
      }
      .hero-bar:nth-child(3) i {
        width: 46%;
        background: var(--blue);
      }
      .hero-board p {
        margin: 42px 0 0;
        font-size: 1.2rem;
        line-height: 1.35;
      }
      .summary-switch {
        display: flex;
        gap: 6px;
        margin-bottom: 26px;
        padding: 4px;
        background: rgba(255, 255, 255, .1);
        border-radius: 10px;
      }
      .summary-switch button {
        flex: 1;
        padding: 8px 10px;
        color: #bad0d5;
        background: transparent;
        border: 0;
        border-radius: 7px;
        font-weight: 700;
      }
      .summary-switch button.active {
        color: var(--navy);
        background: var(--orange);
      }
      .summary-metrics {
        display: grid;
        gap: 18px;
      }
      .summary-metric {
        display: grid;
        gap: 7px;
      }
      .summary-metric-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #fff;
        font-size: .9rem;
      }
      .summary-metric-header strong {
        color: var(--orange);
        font-size: 1rem;
      }
      .summary-track {
        height: 11px;
        overflow: hidden;
        background: rgba(255, 255, 255, .18);
        border-radius: 99px;
      }
      .summary-fill {
        display: block;
        width: 0;
        height: 100%;
        background: var(--orange);
        border-radius: inherit;
        transition: width .5s cubic-bezier(.2, .8, .2, 1);
      }
      .summary-metric:nth-child(2) .summary-fill { background: var(--mint); }
      .summary-metric:nth-child(3) .summary-fill { background: var(--blue); }
      .summary-metric.is-updating .summary-fill {
        animation: summary-fill .55s ease both;
      }
      @keyframes summary-fill {
        from { opacity: .35; transform: scaleX(.2); transform-origin: left; }
        to { opacity: 1; transform: scaleX(1); transform-origin: left; }
      }
      .feature-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        width: min(1180px, calc(100% - 36px));
        margin: 0 auto;
        padding-bottom: 80px;
      }
      .feature {
        padding: 22px;
        background: var(--card-surface);
        border: 1.5px solid var(--card-border);
        border-radius: 16px;
      }
      .feature b {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        margin-bottom: 18px;
        color: var(--navy);
        background: var(--orange);
        border-radius: 10px;
      }
      .feature p {
        margin: 7px 0 0;
        color: var(--muted);
      }
      .dashboard-overview {
        width: min(1180px, calc(100% - 36px));
        margin: 0 auto;
        padding: 0 0 80px;
      }
      .section-heading {
        max-width: 650px;
        margin-bottom: 22px;
      }
      .section-heading p {
        margin: 8px 0 0;
        color: var(--muted);
      }
      .capability-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .capability {
        min-height: 150px;
        padding: 18px;
        background: var(--card-surface);
        border: 1.5px solid var(--card-border);
        border-radius: 14px;
      }
      .capability b {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        margin-bottom: 16px;
        color: var(--navy);
        background: var(--orange);
        border-radius: 9px;
      }
      .capability p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: .9rem;
      }
      .login-shell {
        display: grid;
        min-height: 100vh;
        grid-template-columns: minmax(300px, 43%) 1fr;
      }
      .login-visual {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 32px clamp(24px, 6vw, 80px);
        color: #fff;
        background: var(--navy);
      }
      .login-visual::after {
        content: "•";
        width: 190px;
        height: 190px;
        align-self: flex-end;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 50%;
        box-shadow:
          0 0 0 34px rgba(255, 255, 255, 0.04),
          0 0 0 68px rgba(255, 255, 255, 0.03);
      }
      .login-brand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .login-brand-row .theme-toggle {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.25);
      }
      .brand {
        font-size: 1.45rem;
        letter-spacing: -0.04em;
      }
      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 29px;
        height: 29px;
        margin-right: 8px;
        color: var(--navy);
        background: var(--orange);
        border-radius: 8px;
        font-size: 0.9rem;
      }
      .login-copy {
        max-width: 480px;
      }
      .login-copy p {
        max-width: 390px;
        margin: 22px 0 0;
        color: #c8d8de;
        font-size: 1.08rem;
      }
      .login-note {
        color: #9db6bf;
        font-size: 0.88rem;
      }
      .text-link {
        color: var(--blue);
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: color 0.18s ease, text-decoration-color 0.18s ease;
      }
      .text-link:hover {
        text-decoration: underline;
      }
      .text-link:focus-visible {
        border-radius: 2px;
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }
      .inline-link-row {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .inline-link-row .text-link {
        text-decoration: underline;
        text-decoration-color: transparent;
        text-underline-offset: 3px;
      }
      .inline-link-row .text-link:hover {
        text-decoration-color: currentColor;
      }
      .auth-footer-link {
        display: block;
        margin-top: 18px;
        text-align: center;
      }
      .auth-footer-link .text-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
        transition: color 0.2s ease;
      }
      .auth-footer-link .text-link:hover {
        color: var(--blue);
      }
      .login-panel {
        display: grid;
        place-items: center;
        padding: 32px 22px;
      }
      .icon-back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        color: var(--muted);
        background: var(--surface-muted);
        border: 1.5px solid var(--line);
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 700;
        line-height: 1;
        transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      }
      .icon-back-btn svg {
        flex: none;
      }
      .icon-back-btn:hover {
        color: var(--blue);
        background: var(--surface);
        border-color: var(--blue);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(31, 41, 51, 0.08);
      }
      .icon-back-btn:active {
        transform: translateY(0);
        box-shadow: none;
      }
      .icon-back-btn:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }
      .login-card {
        width: min(100%, 430px);
        padding: 34px;
        background: var(--card-surface);
        border: 1.5px solid var(--card-border);
        border-radius: 22px;
        box-shadow: var(--shadow);
      }
      .login-card p {
        color: var(--muted);
      }
      .auth-switch {
        display: flex;
        gap: 6px;
        padding: 4px;
        margin: 18px 0;
        background: var(--soft);
        border-radius: 10px;
      }
      .auth-switch button {
        flex: 1;
        padding: 9px;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 7px;
        font-weight: 700;
      }
      .auth-switch button.active {
        color: var(--navy);
        background: var(--surface);
        box-shadow: 0 2px 7px rgba(16, 42, 67, 0.1);
      }
      .role-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 18px 0;
      }
      .role-tab {
        padding: 12px;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-weight: 700;
      }
      .role-tab.active {
        color: var(--blue);
        background: var(--mint);
        border-color: var(--blue);
      }
      .password-wrap {
        position: relative;
      }
      .password-wrap input {
        padding-right: 48px;
      }
      .eye-button {
        position: absolute;
        top: 50%;
        right: 5px;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        transform: translateY(-50%);
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 8px;
      }
      .eye-button svg {
        width: 20px;
        height: 20px;
      }
      .eye-button:hover {
        color: var(--blue);
        background: var(--soft);
      }
      .icon-text-btn {
        gap: 8px;
      }
      .account-grid {
        display: grid;
        gap: 10px;
        margin: 22px 0;
      }
      .account {
        padding: 14px;
        color: var(--ink);
        text-align: left;
        background: var(--card-surface);
        border: 1.5px solid var(--card-border);
        border-radius: 12px;
      }
      .account:hover {
        border-color: var(--blue);
      }
      .account strong,
      .account small {
        display: block;
      }
      .account small {
        margin-top: 3px;
        color: var(--muted);
      }
      .field {
        display: grid;
        gap: 7px;
        margin: 15px 0;
      }
      label {
        font-weight: 600;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 12px 13px;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: 0;
      }
      textarea {
        min-height: 130px;
        resize: vertical;
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px var(--focus-ring);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 17px;
        color: #fff;
        background: var(--blue);
        border: 0;
        border-radius: 10px;
        font-weight: 700;
      }
      .btn:hover {
        filter: brightness(0.94);
      }
      .btn.secondary {
        color: var(--navy);
        background: var(--soft);
      }
      .btn.ghost {
        color: var(--blue);
        background: transparent;
        border: 1px solid var(--blue);
      }
      .btn.danger {
        color: var(--danger);
        background: #fff0ef;
      }
      .btn.small {
        padding: 5px 12px;
        font-size: 0.82rem;
      }
      .full {
        width: 100%;
      }
      .error {
        padding: 11px 13px;
        color: var(--danger);
        background: #fff0ef;
        border: 1px solid #f1c8c5;
        border-radius: 10px;
      }
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px clamp(18px, 5vw, 70px);
        color: #fff;
        background: var(--navy);
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .profile-meta {
        min-width: 0;
      }
      .profile-action {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        color: #dfeaf0;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        font-size: 0.78rem;
        font-weight: 700;
        transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      }
      .profile-action:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.17);
        border-color: rgba(255, 255, 255, 0.42);
        transform: translateY(-1px);
      }
      .profile-action:active {
        transform: translateY(0) scale(0.98);
      }
      .profile-action:focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 3px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 37px;
        height: 37px;
        color: var(--navy);
        background: var(--orange);
        border-radius: 50%;
        font-weight: 700;
      }
      .profile small {
        display: block;
        color: #b8cbd1;
      }
      .app-main {
        width: min(1180px, calc(100% - 36px));
        margin: 0 auto;
        padding: 46px 0 80px;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--blue);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.76rem;
      }
      .intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 30px;
      }
      .intro p {
        max-width: 570px;
        margin: 12px 0 0;
        color: var(--muted);
      }
      .stats {
        display: grid;

  <body>
    <div id="app"></div>
    <script>
      const app = document.getElementById("app");
      const state = {
        token: sessionStorage.getItem("quto_token"),
        user: null,
        dashboard: null,
        notice: null,
        studentTab: "explore",
        selectedRole: "student",
        selectedCourseId: null,
        demoLecturerInvitation: null,
      };
      const DEMO_LECTURER_CREDENTIALS = {
        name: "Dosen Demo",
        email: "dosen.demo@quto.id",
        password: "dosen123",
      };
      const savedTheme = localStorage.getItem("quto_theme");
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
        .matches
        ? "dark"
        : "light";
      document.documentElement.dataset.theme = savedTheme || systemTheme;

      const SVG_NS = "http://www.w3.org/2000/svg";
      const SVG_TAGS = new Set(["svg", "path", "circle", "rect", "line", "polyline", "polygon", "ellipse", "g", "defs", "use", "clipPath", "mask"]);
      const el = (tag, attrs = {}, ...children) => {
        const node = SVG_TAGS.has(tag)
          ? document.createElementNS(SVG_NS, tag)
          : document.createElement(tag);
        Object.entries(attrs).forEach(([key, value]) => {
          if (key === "class" && !SVG_TAGS.has(tag)) node.className = value;
          else if (key === "text") node.textContent = value;
          else if (key.startsWith("on"))
            node.addEventListener(key.slice(2), value);
          else node.setAttribute(key, value);
        });
        node.append(
          ...children.filter(
            (child) => child !== null && child !== false && child !== undefined,
          ),
        );
        return node;
      };

      function uiIcon(name) {
        const shapes = {
          eye: [
            el("path", { d: "M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" }),
            el("circle", { cx: "12", cy: "12", r: "3" }),
          ],
          eyeOff: [
            el("path", { d: "m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" }),
            el("path", { d: "M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4.1-.8" }),
          ],
          back: [
            el("path", { d: "M19 12H5m7 7-7-7 7-7" }),
          ],
          close: [
            el("path", { d: "m18 6-12 12M6 6l12 12" }),
          ],
          download: [
            el("path", { d: "M12 3v12m-5-5 5 5 5-5M5 21h14" }),
          ],
          moon: [
            el("path", { d: "M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" }),
          ],
          search: [
            el("circle", { cx: "10.8", cy: "10.8", r: "6.8" }),
            el("path", { d: "m16 16 4.5 4.5" }),
          ],
          user: [
            el("circle", { cx: "12", cy: "8", r: "4" }),
            el("path", { d: "M5 21a7 7 0 0 1 14 0" }),
          ],
          sun: [
            el("circle", { cx: "12", cy: "12", r: "4" }),
            el("path", { d: "M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" }),
          ],
        };
        return el(
          "svg",
          {
            width: "20",
            height: "20",
            viewBox: "0 0 24 24",
            fill: "none",
            stroke: "currentColor",
            "stroke-width": "1.8",
            "stroke-linecap": "round",
            "stroke-linejoin": "round",
            "aria-hidden": "true",
            focusable: "false",
          },
          ...shapes[name],
        );

      async function api(path, options = {}) {
        const isFormData = options.body instanceof FormData;
        const headers = {
          ...(options.body && !isFormData ? { "content-type": "application/json" } : {}),
          ...(options.headers || {}),
        };
        if (state.token) headers.authorization = `Bearer ${state.token}`;
        const response = await fetch(path, { ...options, headers });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = data.detail;
          const errorData =
            detail && typeof detail === "object" && !Array.isArray(detail)
              ? detail
              : data;
          const validationMessage = Array.isArray(detail)
            ? detail
                .map((item) => {
                  const location = Array.isArray(item.loc)
                    ? item.loc.filter((part) => part !== "body").join(".")
                    : "";
                  return [location, item.msg].filter(Boolean).join(": ");
                })
                .filter(Boolean)
                .join("; ")
            : null;
          const message =
            errorData.message ||
            (typeof detail === "string" ? detail : null) ||
            validationMessage ||
            "Permintaan tidak dapat diproses.";
          const error = new Error(message);
          error.code = errorData.code;
          error.status = response.status;
          throw error;
        }
        return data;
      }

      function showError(message) {
        return message
          ? el("p", { class: "error", role: "alert", text: message })
          : null;
      }

      function themeToggle() {
        const button = el("button", {
          class: "theme-toggle floating-theme-toggle",
          type: "button",
          "aria-label": "Gunakan mode gelap",
          title: "Gunakan mode gelap",
        });
        const update = () => {
          const dark = document.documentElement.dataset.theme === "dark";
          const label = dark ? "Gunakan mode terang" : "Gunakan mode gelap";
          button.replaceChildren(uiIcon(dark ? "sun" : "moon"));
          button.setAttribute("aria-label", label);
          button.title = label;
        };
        button.addEventListener("click", () => {
          const next =
            document.documentElement.dataset.theme === "dark"
              ? "light"
              : "dark";
          document.documentElement.dataset.theme = next;
          localStorage.setItem("quto_theme", next);
          update();
        });
        update();
        return button;
      }

      function passwordField(label, autocomplete = "current-password") {
        const input = el("input", {
          type: "password",
          placeholder: label,
          autocomplete,
        });
        const toggle = el("button", {
          class: "eye-button",
          type: "button",
          "aria-label": `Tampilkan ${label.toLowerCase()}`,
          title: `Tampilkan ${label.toLowerCase()}`,
          "aria-pressed": "false",
        }, uiIcon("eye"));
        toggle.addEventListener("click", () => {
          const visible = input.type === "text";
          input.type = visible ? "password" : "text";
          const action = visible ? "Tampilkan" : "Sembunyikan";
          toggle.replaceChildren(uiIcon(visible ? "eye" : "eyeOff"));
          toggle.setAttribute("aria-pressed", String(!visible));
          toggle.setAttribute(
            "aria-label",
            `${action} ${label.toLowerCase()}`,
          );
          toggle.title = toggle.getAttribute("aria-label");
        });
        return {
          input,
          wrapper: el("div", { class: "password-wrap" }, input, toggle),
        };
      }

      function summaryPreview() {
        const modes = {
          lecturer: {
            label: "Dosen",
            context: "Ruang dosen",
            description: "Pantau course, quiz, dan aktivitas mahasiswa dalam satu ruang.",
            metrics: [
              ["Course aktif", "8", 82],
              ["Quiz dibuat", "12", 72],
              ["Mahasiswa aktif", "86%", 86],
            ],
          },
          student: {
            label: "Mahasiswa",
            context: "Ruang mahasiswa",
            description: "Lihat course, quiz, dan perkembangan belajar Anda dengan cepat.",
            metrics: [
              ["Course diikuti", "4", 55],
              ["Quiz selesai", "8", 76],
              ["Nilai rata-rata", "84%", 84],
            ],
          },
        };
        const modeButtons = {};
        const metricRefs = modes.lecturer.metrics.map(([label]) => ({
          label: el("span", { text: label }),
          value: el("strong", { text: "" }),
          fill: el("i", { class: "summary-fill" }),
          card: el("div", { class: "summary-metric" }),
        }));
        metricRefs.forEach((metric) => {
          metric.card.append(
            el(
              "div",
              { class: "summary-metric-header" },
              metric.label,
              metric.value,
            ),
            el("div", { class: "summary-track" }, metric.fill),
          );
        });
        const context = el("small", { text: "Ruang dosen" });
        const description = el("p", { text: "" });
        const update = (mode) => {
          const data = modes[mode];
          context.textContent = data.context;
          description.textContent = data.description;
          data.metrics.forEach(([label, value, progress], index) => {
            const metric = metricRefs[index];
            metric.label.textContent = label;
            metric.value.textContent = value;
            metric.fill.style.width = `${progress}%`;
            metric.card.classList.remove("is-updating");
            requestAnimationFrame(() => metric.card.classList.add("is-updating"));
          });
          Object.entries(modeButtons).forEach(([key, button]) => {
            button.classList.toggle("active", key === mode);
            button.setAttribute("aria-selected", String(key === mode));
          });
        };
        const switcher = el("div", {
          class: "summary-switch",
          role: "tablist",
          "aria-label": "Pilih ringkasan dashboard",
        });
        Object.entries(modes).forEach(([key, data]) => {
          const button = el("button", {
            type: "button",
            role: "tab",
            "aria-selected": "false",
            text: data.label,
            onclick: () => update(key),
          });
          modeButtons[key] = button;
          switcher.append(button);
        });
        update("lecturer");

        return el(
          "section",
          {
            class: "hero-art",
            "aria-label": "Ringkasan interaktif Quto LMS",
          },
          el(
            "div",
            { class: "hero-board" },
            el(
              "header",
              {},
              el("strong", { text: "Ringkasan Quto LMS" }),
              context,
            ),
            switcher,
            el("div", { class: "summary-metrics" }, ...metricRefs.map((metric) => metric.card)),
            description,
          ),
        );
      }

      function authPage(mode = "login") {
        const demoLecturerRegistration = mode === "demo-lecturer-register";
        const lecturerRegistration =
          mode === "lecturer-register" || demoLecturerRegistration;
        const register = mode !== "login";
        const notice = state.notice ? showError(state.notice) : null;
        state.notice = null;
        const email = el("input", {
          type: "email",
          value: demoLecturerRegistration
            ? DEMO_LECTURER_CREDENTIALS.email
            : "",
          placeholder: "email@kampus.ac.id",
          autocomplete: "username",
          required: "",
          ...(demoLecturerRegistration ? { readonly: "" } : {}),
        });
        const password = passwordField(
          register ? "Password minimal 6 karakter" : "Password",
        );
        const roleTabs = !register
          ? el(
              "div",
              { class: "role-tabs", role: "group", "aria-label": "Pilih role" },
              ...[
                ["lecturer", "Dosen"],
                ["student", "Mahasiswa"],
              ].map(([role, label]) =>
                el("button", {
                  type: "button",
                  class: `role-tab${state.selectedRole === role ? " active" : ""}`,
                  "aria-pressed": state.selectedRole === role ? "true" : "false",
                  text: label,
                  onclick: () => {
                    state.selectedRole = role;
                    roleTabs.querySelectorAll(".role-tab").forEach((tab, index) => {
                      const selected = index === (role === "lecturer" ? 0 : 1);
                      tab.classList.toggle("active", selected);
                      tab.setAttribute("aria-pressed", String(selected));
                    });
                  },
                }),
              ),

          : null;
        if (demoLecturerRegistration) {
          password.input.value = DEMO_LECTURER_CREDENTIALS.password;
          password.input.readOnly = true;
        }
        const name = register
          ? el("input", {
              value: demoLecturerRegistration

          error.replaceChildren();

                  email: email.value,

                  email: email.value,
                  password: password.input.value,
                  role: state.selectedRole,

        landing();

      async function loadDashboard() {
        try {
          if (!state.user) state.user = await api("/api/auth/me");
          state.dashboard = await api("/api/lms/dashboard");
          renderDashboard();
        } catch (err) {
          if (err && err.status === 401) {
            sessionStorage.removeItem("quto_token");
            state.token = null;
            state.user = null;
            login();
            return;
          }
          alert(err?.message || "Gagal memuat dashboard. Coba lagi.");
        }
      }

        api("/api/auth/logout", { method: "POST" }).catch(() => {});
        sessionStorage.removeItem("quto_token");
        state.token = null;
        state.user = null;
        state.dashboard = null;
        login();
      }

          if (isEnrolled) {
            actionWrap.append(
              el("span", { class: "pill", text: "Sudah bergabung" }),
              el("button", {
                class: "btn secondary",
                type: "button",
                onclick: () => openStudentCourse(course.id),
                text: "Buka course",
              }),
            );
          } else {
            const joinBtn = el("button", {
              class: "btn",
              type: "button",
              text: "+ Gabung",
            });
            joinBtn.onclick = async () => {
              joinBtn.disabled = true;
              joinBtn.textContent = "Bergabung...";
              try {
                await api(`/api/lms/courses/${course.id}/enroll`, { method: "POST" });
                course.enrolled = true;
                course.student_count = (course.student_count || 0) + 1;
                state.dashboard = await api("/api/lms/dashboard");
                updateActions(true);
              } catch (err) {
                alert(err.message || "Gagal bergabung course.");
                joinBtn.disabled = false;
                joinBtn.textContent = "+ Gabung";
              }
            };
            actionWrap.append(joinBtn);
          }
        };
        updateActions(Boolean(course.enrolled));

        return el(
          "article",
          { class: "course-card" },
          el(
            "header",
            {},
            el(
              "div",
              {},
              el("span", { class: "pill", text: `${course.quiz_count || 0} quiz` }),
              el("h3", { text: course.name }),
            ),
            el("span", {
              class: "course-meta",
              text: `${course.student_count || 0} mahasiswa`,
            }),
          ),
          el("p", { text: course.description }),
          actionWrap,
        );
      }

      function renderDashboard() {
        const lecturer = state.user.role === "lecturer";
        const courses = state.dashboard.courses || [];
        const isExplore = !lecturer && (state.studentTab === "explore" || !state.studentTab);
        const selectedCourse = !lecturer && state.studentTab === "course"
          ? courses.find((course) => course.id === state.selectedCourseId) || null
          : null;
        if (!lecturer && state.studentTab === "course" && !selectedCourse) {
          state.studentTab = "explore";
          state.selectedCourseId = null;
        }
        const visibleCourses = selectedCourse ? [selectedCourse] : [];
        const quizCount = courses.reduce(
          (sum, course) => sum + course.quizzes.length,
          0,
        );
        const studentCount = courses.reduce(
          (sum, course) => sum + (course.student_count || 0),
          0,
        );
        const completed = courses.reduce(
          (sum, course) =>
            sum + course.quizzes.filter((quiz) => quiz.submitted).length,
          0,
        );
        const name = state.user.name
          .replace(/^(?:Dr\.?|Prof\.?|Ir\.?)\s+/i, "")
          .split(/\s+/)[0];
        const actionButton = lecturer
          ? null
          : el("button", {
              class: "btn secondary",
              type: "button",
              onclick: () => setStudentTab("explore"),
              text: "Jelajahi course",
            });
        let activeFilter = "all";
        const courseList = el("div", { class: "course-list" });
        const matchesFilter = (course) => {
          if (activeFilter === "quiz") return course.quizzes.length > 0;
          if (activeFilter === "pending")
            return course.quizzes.some((quiz) => !quiz.submitted);
          if (activeFilter === "done")
            return course.quizzes.some((quiz) => quiz.submitted);
          return true;
        };
        const renderCourses = (query) => {
          const normalizedQuery = query.trim().toLowerCase();
          const visibleCourses = courses.filter(
            (course) =>
              matchesFilter(course) &&
              `${course.name} ${course.description}`
                .toLowerCase()
                .includes(normalizedQuery),
          );
          if (visibleCourses.length) {
            courseList.replaceChildren(...visibleCourses.map(courseCard));
          } else if (courses.length === 0) {
            courseList.replaceChildren(
              el(
                "div",
                { class: "empty", style: "padding: 36px 16px; text-align: center;" },
                el("h3", { text: "Anda belum mengikuti course apa pun", style: "margin: 0 0 8px; color: var(--navy);" }),
                el("p", {
                  class: "muted",
                  style: "max-width: 480px; margin: 0 auto 18px;",
                  text: 'Tersedia 10 course siap dipelajari. Klik "Jelajahi course", lalu "Gabung" atau "Buka course" pada course yang diinginkan.',
                }),
                el("button", {
                  class: "btn",
                  type: "button",
                  onclick: () => setStudentTab("explore"),
                  text: "Jelajahi course",
                }),
              ),
            );
          } else {
            courseList.replaceChildren(
              el("div", {
                class: "empty",
                text: "Tidak ada course yang cocok dengan filter ini.",
              }),
            );
          }
        };
        const search = el("input", {
          class: "dashboard-search",
          type: "search",
          placeholder: lecturer ? "Cari course..." : selectedCourse ? "Buka Jelajahi course untuk mencari" : "Cari di katalog course...",
          "aria-label": lecturer ? "Cari course" : "Cari course di katalog",
        });
        if (!lecturer && selectedCourse) search.disabled = true;

        const filterTabs = el("div", {
          class: "filter-tabs",
          role: "tablist",
          "aria-label": "Filter course",
        });
        const filters = lecturer
          ? [
              ["all", "Semua"],
              ["quiz", "Ada quiz"],
            ]
          : [
              ["all", "Semua"],
              ["pending", "Belum selesai"],
              ["done", "Selesai"],
            ];
        filters.forEach(([value, label]) =>
          filterTabs.append(
            el("button", {
              class: "filter-tab" + (value === activeFilter ? " active" : ""),
              type: "button",
              role: "tab",
              "aria-selected": String(value === activeFilter),
              onclick: () => {
                activeFilter = value;
                [...filterTabs.children].forEach((tab) =>
                  tab.classList.toggle("active", tab.textContent === label),
                );
                renderCourses(search.value);
              },
              text: label,
            }),
          ),
        );

        if (!lecturer) {
          if (selectedCourse) {
            // selected course rendered directly below
          } else {
            courseList.replaceChildren(
              el("div", { class: "empty", text: "Memuat daftar course..." }),
            );
            api("/api/lms/courses")
              .then((res) => {
                const catalog = res.courses || [];
                const renderCatalog = (query = "") => {
                  const q = query.trim().toLowerCase();
                  const filtered = catalog.filter((c) =>
                    `${c.name} ${c.description}`.toLowerCase().includes(q),
                  );
                  courseList.replaceChildren(
                    ...(filtered.length
                      ? filtered.map(exploreCourseCard)
                      : [
                          el("div", {
                            class: "empty",
                            text: "Tidak ada course yang sesuai dengan pencarian.",
                          }),
                        ]),
                  );
                };
                search.addEventListener("input", () => renderCatalog(search.value));
                renderCatalog("");
              })
              .catch((err) => {
                courseList.replaceChildren(
                  showError(err.message || "Gagal memuat katalog course."),
                );
              });
          }
        } else {
          search.addEventListener("input", () => renderCourses(search.value));
          renderCourses("");
        }

        const navTabs = selectedCourse
          ? el(
              "button",
              {
                class: "btn secondary icon-text-btn",
                type: "button",
                onclick: () => setStudentTab("explore"),
              },
              uiIcon("back"),
              el("span", { text: "Keluar course" }),
            )
          : null;

        app.replaceChildren(
          el(
            "header",
            { class: "app-header" },
            el(
              "div",
              { class: "brand" },
              el("span", { class: "brand-mark", text: "Q" }),
              "Quto LMS",
            ),
            el(
              "div",
              { class: "profile" },
              el("button", {
                class: "profile-action",
                type: "button",
                onclick: openProfileEditor,
              }, uiIcon("user"), el("span", { text: "Edit profil" })),
              el("button", {
                class: "btn secondary",
                type: "button",
                onclick: logout,
                text: "Keluar",
              }),
            ),
          ),
          el(
            "main",
            { class: "app-main" },
            el(
              "section",
              { class: "intro" },
              el(
                "div",
                {},
                el("p", {
                  class: "eyebrow",
                  text: lecturer ? "Ruang dosen" : "Ruang mahasiswa",
                }),
                el("h1", { text: `Halo, ${name}.` }),
                el("p", {
                  text: lecturer
                    ? "Pantau kelas dan susun pengalaman belajar yang lebih hidup."
                    : "Lanjutkan belajar dan selesaikan quiz yang tersedia.",
                }),
              ),
              actionButton,
            ),
            el(
              "section",
              { class: "stats" },
              stat(
                courses.length,
                lecturer ? "Course dikelola" : "Course diikuti",
              ),
              stat(quizCount, "Quiz tersedia"),
              stat(
                lecturer ? studentCount : completed,
                lecturer ? "Mahasiswa terdaftar" : "Quiz selesai",
              ),
            ),
            el(
              "section",
              { class: "dashboard-tools" },
              search,
              lecturer ? filterTabs : null,
            ),
            el(
              "section",
              { class: "layout" },
              el(
                "div",
                { class: "panel" },
                el(
                  "header",
                  {},
                  el(
                    "div",
                    {},
                    el("h2", {
                      text: lecturer
                        ? "Course saya"
                        : selectedCourse
                          ? selectedCourse.name
                          : "Jelajahi course",
                    }),
                    el("p", {
                      text: lecturer
                        ? "Kelola quiz dari setiap course."
                        : selectedCourse
                          ? "Halaman course ini. Course lain disembunyikan."
                          : "Pilih dari course yang tersedia, lalu klik Gabung atau Buka course.",
                    }),
                  ),
                  navTabs,
                ),
                lecturer
                  ? courseList
                  : selectedCourse
                    ? el("div", { class: "course-list" }, courseCard(selectedCourse))
                    : courseList,
              ),
              lecturer ? teacherAside() : studentAside(courses),
            ),
          ),
          siteFooter("dashboard-footer"),
        );
      }

      function stat(value, label) {
        return el(
          "div",
          { class: "stat" },
          el("strong", { text: String(value) }),
          el("span", { text: label }),
        );
      }

      function courseCard(course) {
        const lecturer = state.user.role === "lecturer";
        const roster = lecturer
          ? el(
              "details",
              { class: "student-roster" },
              el("summary", {
                text: `Daftar mahasiswa (${course.student_count})`,
              }),
              el(
                "ul",
                {},
                ...(course.students || []).map((name) => el("li", { text: name })),
              ),
            )
          : null;
        const quizzes = course.quizzes.length
          ? el(
              "div",
              { class: "quiz-list" },
              ...course.quizzes.map((quiz) => quizCard(quiz)),
            )
          : el("div", {
              class: "empty",
              text: lecturer
                ? "Belum ada quiz. Buat quiz pertama dari materi kelas."
                : "Belum ada quiz untuk course ini.",
            });
        return el(
          "article",
          { class: "course-card" },
          el(
            "header",
            {},
            el(
              "div",
              {},
              el("span", {
                class: "pill",
                text: course.is_global
                  ? "Untuk semua akun"
                  : lecturer
                    ? "Course dosen"
                    : "Terdaftar",

              el("h3", { text: course.name }),

            el(
              "div",
              { style: "display: flex; gap: 8px; align-items: center; flex-wrap: wrap;" },
              lecturer
                ? el("button", {
                    class: "btn secondary small",

      function quizCard(quiz) {
        const lecturer = state.user.role === "lecturer";
        const action = el(
          "div",
          { class: "quiz-actions" },
          lecturer
            ? el(
                "div",
                { class: "quiz-actions" },
                el("span", { class: "pill", text: `${quiz.question_count} soal` }),
                el("button", {
                  class: "btn secondary",
                  type: "button",
                  onclick: () => viewSubmissions(quiz.id),
                  text: "Lihat jawaban",
                }),
              )
            : el(
                "div",
                { class: "quiz-actions" },
                el("button", {
                  class: "btn " + (quiz.submitted ? "secondary" : ""),
                  onclick: () => (quiz.submitted ? viewQuizResult(quiz.id) : openQuiz(quiz.id)),
                  text: quiz.submitted ? `Nilai ${quiz.score}` : "Mulai quiz",

                  ? el("button", {

                      onclick: () => openGame(quiz.id),
                      text: "Mainkan game",

                  : null,
              ),
          el("button", {
            class: "btn ghost icon-text-btn",
            type: "button",
            onclick: () => downloadQuizPdf(quiz.id),
            title: "Unduh quiz sebagai PDF",

        return el(
          "div",
          { class: "quiz-card" },
          el(
            "div",
            {},
            el("strong", { text: quiz.title }),
            el("p", {
              text: lecturer

                : `${quiz.question_count} soal · ${quiz.submitted ? "Sudah dikumpulkan" : "Belum dikerjakan"}`,

      function teacherAside() {
        return el(
          "aside",
          { class: "panel" },
          el(
            "header",
            {},
            el(
              "div",
              {},
              el("h2", { text: "Aksi cepat" }),
              el("p", { text: "Bangun aktivitas kelas berikutnya." }),

          el("button", {

      function studentAside(courses) {
        const quizzes = courses.flatMap((course) => course.quizzes);
        const completed = quizzes.filter((quiz) => quiz.submitted);
        const nextQuiz = quizzes.find((quiz) => !quiz.submitted);
        const xp = completed.reduce(
          (sum, quiz) => sum + Math.round(quiz.question_count * (quiz.score || 0) / 100) * 10,
          0,
        );
        const achievements = [
          {
            title: "Langkah pertama",
            detail: "Selesaikan quiz pertamamu",
            earned: completed.length >= 1,
          },
          {
            title: "Rajin berlatih",
            detail: "Selesaikan 3 quiz",
            earned: completed.length >= 3,
          },
          {
            title: "Nilai sempurna",
            detail: "Raih nilai 100",
            earned: completed.some((quiz) => quiz.score === 100),
          },
        ];
        return el(
          "aside",
          { class: "panel" },
          el(
            "header",
            {},
            el(
              "div",
              {},
              el("h2", { text: "Ritme belajar" }),
              el("p", { text: "Konsistensi kecil, hasilnya terasa." }),
            ),
          ),
          el(
            "div",
            { class: "student-xp" },
            el("strong", { text: `${xp} XP` }),
            el("span", { text: `${completed.length} quiz selesai` }),
          ),
          el(
            "section",
            { class: "challenge-section" },
            el("h3", { text: "Tantangan berikutnya" }),
            el("p", {
              text: courses.length === 0
                ? "Anda belum bergabung ke course mana pun."
                : nextQuiz
                  ? `${nextQuiz.title} · ${nextQuiz.question_count} soal`
                  : "Semua quiz sudah selesai. Hebat!",
            }),
            courses.length === 0
              ? el("button", {
                  class: "btn full icon-text-btn",
                  type: "button",
                  onclick: () => setStudentTab("explore"),
                }, uiIcon("search"), el("span", { text: "Jelajahi & gabung course" }))
              : nextQuiz
                ? el("button", {
                    class: "btn full",
                    type: "button",
                    onclick: () => openGame(nextQuiz.id),
                    text: "Mainkan tantangan",
                  })
                : null,
          ),
          el(
            "section",
            { class: "challenge-section", style: "margin-top: 14px;" },
            el("h3", { text: "Katalog Course" }),
            el("p", {
              text: "Temukan 10 pilihan materi lengkap dari Basis Data, Web, AI, hingga Cloud.",
            }),
            el("button", {
              class: "btn secondary full icon-text-btn",
              type: "button",
              onclick: () => setStudentTab("explore"),
            }, uiIcon("search"), el("span", { text: "Jelajahi semua course" })),
          ),
          el(
            "section",
            { class: "achievement-section" },
            el("h3", { text: "Pencapaian" }),
            el(
              "ul",
              { class: "achievement-list" },
              ...achievements.map((achievement) =>
                el(
                  "li",
                  { class: "achievement" + (achievement.earned ? " earned" : "") },
                  el("span", {
                    class: "achievement-mark",
                    "aria-hidden": "true",
                    text: achievement.earned ? "✓" : "·",
                  }),
                  el("strong", { text: achievement.title }),
                  el("small", { text: achievement.detail }),
                ),
              ),
            ),
          ),
        );
      }

      function modal(title, content, onClose = () => {}) {
        const backdrop = el("div", { class: "modal-backdrop" });
        const close = () => {
          backdrop.remove();
          onClose();
        };
        backdrop.append(
          el(
            "section",
            { class: "modal" },
            el(
              "header",
              {},
              el("h2", { text: title }),
              el("button", {
                class: "close",
                onclick: close,
                "aria-label": "Tutup",
                title: "Tutup",
              }, uiIcon("close")),
            ),
            content,
          ),
        );
        backdrop.addEventListener("click", (event) => {
          if (event.target === backdrop) close();
        });
        document.body.append(backdrop);
        return { close };
      }

      function openResetPassword(prefillEmail = "") {
        // Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬ Langkah 1: minta token Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬
        const email = el("input", {
          type: "email",
          value: prefillEmail,
          placeholder: "Email terdaftar Anda",
          autocomplete: "username",
          required: "",
        });
        const step1Error = el("div");
        const step1Body = el(
          "form",
          {
            onsubmit: async (evt) => {
              evt.preventDefault();
              step1Error.replaceChildren();
              try {
                const result = await api("/api/auth/reset-password/request", {
                  method: "POST",
                  body: JSON.stringify({ email: email.value.trim() }),
                });
                // Jika token diterima, langsung buka form konfirmasi
                if (result.reset_token) {
                  dialog.close();
                  openResetPasswordConfirm(result.reset_token);
                } else {
                  step1Error.append(showError(result.message || "Periksa email Anda."));
                }
              } catch (err) {
                step1Error.append(showError(err.message));
              }
            },
          },
          el("div", { class: "field" },
            el("label", { text: "Email" }),
            email,
          ),
          el("p", {
            class: "help-text",
            text: "Masukkan email yang terdaftar. Token reset akan ditampilkan di layar.",
          }),
          step1Error,
          el("button", { class: "btn", type: "submit", text: "Minta Token Reset" }),
        );

        const dialog = modal("Ubah Password 🔑 Langkah 1", step1Body);
      }

      function openResetPasswordConfirm(prefillToken = "") {
        // Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬ Langkah 2: konfirmasi token + password baru Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬Ãƒ¢—Ã¢š¬
        const tokenField = el("input", {
          type: "text",
          value: prefillToken,
          placeholder: "Tempel token yang diterima",
          required: "",
          style: "font-family:monospace;font-size:0.85rem;",
        });
        const password = passwordField("Password baru (min. 6 karakter)", "new-password");
        password.input.required = true;
        password.input.minLength = 6;
        password.input.maxLength = 100;
        const step2Error = el("div");

        const dialog = modal(
          "Ubah Password 🔑 Langkah 2",
          el(
            "form",
            {
              onsubmit: async (evt) => {
                evt.preventDefault();
                step2Error.replaceChildren();
                try {
                  const result = await api("/api/auth/reset-password/confirm", {
                    method: "POST",
                    body: JSON.stringify({
                      token: tokenField.value.trim(),
                      password: password.input.value,
                    }),
                  });
                  dialog.close();
                  state.notice = result.message;
                  authPage("login");
                } catch (err) {
                  step2Error.append(showError(err.message));
                }
              },
            },
            el("div", { class: "field" },
              el("label", { text: "Token Reset" }),
              tokenField,
            ),
            el("div", { class: "field" },
              el("label", { text: "Password Baru" }),
              password.wrapper,
            ),
            step2Error,
            el(
              "div",
              { style: "display:flex;align-items:center;gap:10px;flex-wrap:wrap;" },
              el("button", { class: "btn", type: "submit", text: "Simpan Password Baru" }),
              el("button", {
                class: "btn btn-secondary",
                type: "button",
                onclick: () => { dialog.close(); openResetPassword(); },
              }, uiIcon("back"), el("span", { text: "Kembali" })),
            ),
          ),
        );
      }

                    method: "PATCH",

              el("label", { text: "Nama lengkap" }),

              "div",
              { class: "field" },
              el("label", { text: "Email" }),

            ),

              "div",
              { class: "field" },
              el("label", { text: "Password baru" }),

      function openCreateQuiz(courseId = null) {
        const courses = state.dashboard.courses || [];
        if (!courses.length) return openCreateCourse();
        const targetId = typeof courseId === "string" ? courseId : null;
        let course = (targetId && courses.find((item) => item.id === targetId)) || courses[0];
        const courseSelect = el("select", {
          id: "create-quiz-course-select",
          "aria-label": "Pilih course tujuan quiz",
        });
        courses.forEach((item) => {
          const opt = el("option", {
            value: item.id,
            text: item.name,
          });
          if (item.id === course.id) opt.selected = true;
          courseSelect.append(opt);
        });
        courseSelect.value = course.id;
        const courseLabel = el("p", {
          class: "muted",
          style: "margin-top: 4px; font-size: 0.88rem;",
          text: `Course tujuan: ${course.name}`,
        });
        courseSelect.addEventListener("change", () => {
          course = courses.find((item) => item.id === courseSelect.value) || courses[0];
          courseLabel.textContent = `Course tujuan: ${course.name}`;
        });
        let selectedPdf = null;
        const title = el("input", { placeholder: "Contoh: Quiz Bab 1" });
        const text = el("textarea", {
          placeholder: "Tempel materi minimal 50 karakter, atau unggah PDF di atas...",
        });
        const error = el("div");
        const fileInfo = el("div", { hidden: "" });
        const fileInput = el("input", {
          class: "pdf-file-input",
          type: "file",
          accept: ".pdf,application/pdf",
          "aria-label": "Pilih file PDF materi",
        });
        const dropzone = el(
          "label",
          { class: "pdf-dropzone" },
          el("span", { class: "pdf-dropzone-icon", text: "↑" }),
          el("strong", { text: "Pilih PDF atau jatuhkan di sini" }),
          el("small", { text: "PDF berbasis teks · Maksimal 15 MB" }),
          fileInput,
        );
        const updatePdf = (file) => {
          error.replaceChildren();
          if (!file) return;
          if (!file.name.toLowerCase().endsWith(".pdf") || file.type && file.type !== "application/pdf") {
            selectedPdf = null;
            fileInfo.hidden = true;
            error.append(showError("Pilih file PDF yang valid."));
            return;
          }
          if (file.size > 15 * 1024 * 1024) {
            selectedPdf = null;
            fileInfo.hidden = true;
            error.append(showError("Ukuran PDF maksimal 15 MB."));
            return;
          }
          selectedPdf = file;
          fileInfo.hidden = false;
          fileInfo.replaceChildren(
            el(
              "span",
              {},
              el("strong", { text: file.name }),
              el("small", { text: `${(file.size / (1024 * 1024)).toFixed(2)} MB · siap diimpor` }),
            ),
            el("button", {
              class: "pdf-file-remove",
              type: "button",
              "aria-label": "Hapus PDF terpilih",
              text: "Hapus",
              onclick: () => {
                selectedPdf = null;
                fileInput.value = "";
                fileInfo.hidden = true;
              },
            }),
          );
          if (!title.value) title.value = file.name.replace(/\.pdf$/i, "");
        };
        fileInput.addEventListener("change", () => updatePdf(fileInput.files[0]));
        dropzone.addEventListener("dragover", (event) => {
          event.preventDefault();
          dropzone.classList.add("dragging");
        });
        dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragging"));
        dropzone.addEventListener("drop", (event) => {
          event.preventDefault();
          dropzone.classList.remove("dragging");
          updatePdf(event.dataTransfer.files[0]);
        });
        const count = el("input", {
          type: "number",
          min: 1,
          max: 15,
          value: 5,
        });
        const type = el("select");
        [
          ["mix", "Campuran"],
          ["mcq", "Pilihan ganda"],
          ["short", "Isian singkat"],
        ].forEach(([value, label]) =>
          type.append(el("option", { value, text: label })),
        );
        const difficulty = el("select");
        [
          ["easy", "Mudah"],
          ["medium", "Menengah"],
          ["hard", "Sulit"],
        ].forEach(([value, label]) => difficulty.append(el("option", { value, text: label })));
        difficulty.value = "medium";
        const uploadStatus = el("p", { class: "upload-status", hidden: "", role: "status" });
        const submitButton = el("button", {
          class: "btn",
          type: "submit",
          text: "Generate quiz",
        });
        const dialog = modal(
          "Buat quiz dari materi",
          el(
            "form",
            {
              onsubmit: async (event) => {
                event.preventDefault();
                error.replaceChildren();
                if (title.value.trim().length < 2) {
                  error.append(showError("Judul quiz wajib diisi minimal 2 karakter."));
                  return;
                }
                if (!selectedPdf && text.value.trim().length < 50) {
                  error.append(showError("Masukkan materi minimal 50 karakter atau unggah PDF."));
                  return;
                }
                submitButton.disabled = true;
                submitButton.textContent = "Menyusun quiz...";
                uploadStatus.hidden = false;
                uploadStatus.replaceChildren(
                  el("span", { class: "upload-spinner", "aria-hidden": "true" }),
                  el("span", { text: selectedPdf ? "Membaca PDF dan menyusun soal..." : "Menyusun soal dari materi..." }),
                );
                try {
                  const quizData = {
                    title: title.value,
                    count: Number(count.value),
                    type: type.value,
                    difficulty: difficulty.value,
                  };
                  const targetCourseId = courseSelect.value || course.id;
                  if (selectedPdf) {
                    const formData = new FormData();
                    Object.entries(quizData).forEach(([key, value]) => formData.append(key, value));
                    formData.append("file", selectedPdf);
                    await api(`/api/lms/courses/${targetCourseId}/quizzes/pdf`, {
                      method: "POST",
                      body: formData,
                    });
                  } else {
                    await api(`/api/lms/courses/${targetCourseId}/quizzes`, {
                      method: "POST",
                      body: JSON.stringify({ ...quizData, text: text.value }),
                    });
                  }
                  dialog.close();
                  await loadDashboard();
                } catch (err) {
                  error.append(showError(err.message));
                  submitButton.disabled = false;
                  submitButton.textContent = "Coba lagi";
                  uploadStatus.hidden = true;
                }
              },
            },
            el(
              "div",
              { class: "field" },
              el("label", { text: "Pilih course tujuan", for: "create-quiz-course-select" }),
              courseSelect,
              courseLabel,
            ),
            el(
              "div",
              { class: "field" },
              el("label", { text: "Judul quiz" }),
              title,
            ),
            el(
              "div",
              { class: "field" },
              el("label", { text: "Impor materi PDF" }),
              dropzone,
              fileInfo,
              el("p", { class: "muted", text: "Atau tempel teks materi" }),
              text,
            ),
            el(
              "div",
              { class: "field" },
              el("label", { text: "Jumlah soal" }),
              count,
            ),
            el(
              "div",
              { class: "field" },
              el("label", { text: "Tipe soal" }),
              type,
            ),
            el(
              "div",
              { class: "field" },
              el("label", { text: "Tingkat kesulitan" }),
              difficulty,
            ),
            error,
            uploadStatus,
            submitButton,
          ),
        );
      }

      async function downloadQuizPdf(quizId) {
        try {
          const response = await fetch(`/api/lms/quizzes/${quizId}/pdf`, {
            headers: state.token ? { authorization: `Bearer ${state.token}` } : {},
          });
          if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(data.message || "PDF tidak dapat diunduh.");
          }
          const blobUrl = URL.createObjectURL(await response.blob());
          const link = el("a", {
            href: blobUrl,
            download: `quto-quiz-${quizId.slice(0, 8)}.pdf`,
          });
          document.body.append(link);
          link.click();
          link.remove();
          window.setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
        } catch (error) {
          alert(error.message);
        }
      }

      async function viewSubmissions(quizId) {
        try {
          const data = await api(`/api/lms/quizzes/${quizId}/submissions`);
          const list = el("div", { class: "submission-list" });
          if (!data.submissions.length) {
            list.append(el("div", {
              class: "empty",
              text: "Belum ada mahasiswa yang mengumpulkan quiz ini.",
            }));
          }
          data.submissions.forEach((submission) => {
            const answers = el(
              "ul",
              { class: "submission-answers" },
              ...submission.answers.map((answer, index) =>
                el(
                  "li",
                  { class: "submission-answer " + (answer.correct ? "correct" : "incorrect") },
                  el("strong", {
                    text: `${index + 1}. ${answer.correct ? "Benar" : "Salah"}`,
                  }),
                  el("span", { text: answer.question }),
                  el("span", { text: `Jawaban mahasiswa: ${answer.given || "Tidak dijawab"}` }),
                  !answer.correct
                    ? el("span", { text: `Kunci jawaban: ${answer.correct_answer}` })
                    : null,
                ),
              ),
            );
            list.append(
              el(
                "article",
                { class: "submission-card" },
                el(
                  "header",
                  { class: "submission-heading" },
                  el(
                    "div",
                    {},
                    el("strong", { text: submission.student_name }),
                    el("p", { text: `${submission.correct} dari ${submission.total} benar` }),
                  ),
                  el("span", { class: "pill", text: `${submission.score}` }),
                ),
                answers,
              ),
            );
          });
          modal("Jawaban mahasiswa", list);
        } catch (error) {
          alert(error.message);
        }
      }

      async function viewQuizResult(quizId) {
        try {
          const data = await api(`/api/lms/quizzes/${quizId}/submission`);
          const answersList = el(
            "ul",
            { class: "submission-answers" },
            ...data.answers.map((answer, index) =>
              el(
                "li",
                { class: "submission-answer " + (answer.correct ? "correct" : "incorrect") },
                el("strong", {
                  text: `${index + 1}. ${answer.correct ? "✓ Benar" : "✗ Salah"}`,
                }),
                el("span", { style: "font-weight: 600; margin-top: 4px;", text: answer.question }),
                el("span", { text: `Jawaban Anda: ${answer.given || "(kosong)"}` }),
                el("span", { text: `Kunci jawaban: ${answer.correct_answer}` }),
                answer.rationale
                  ? el("span", { class: "muted", style: "font-style: italic; margin-top: 2px;", text: `Pembahasan: ${answer.rationale}` })
                  : null,
              ),
            ),
          );
          const scoreBox = el(
            "div",
            { style: "text-align: center; margin-bottom: 16px; padding: 16px; background: var(--soft); border-radius: 10px;" },
            el("p", { class: "eyebrow", text: "Hasil Quiz (Sudah Dikumpulkan)" }),
            el("strong", { style: "font-size: 2.2rem; color: var(--navy); display: block;", text: `${data.score}` }),
            el("p", { class: "muted", text: `${data.correct} dari ${data.total} soal dijawab dengan benar` }),
          );
          modal(`Hasil: ${data.quiz_title}`, el("div", {}, scoreBox, answersList));
        } catch (error) {
