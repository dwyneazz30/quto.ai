      async function openQuiz(quizId) {
        const isAlreadySubmitted = state.dashboard && state.dashboard.courses && state.dashboard.courses.some(
          (c) => c.quizzes && c.quizzes.some((q) => q.id === quizId && q.submitted)
        );
        if (isAlreadySubmitted) {
          return viewQuizResult(quizId);
        }
        try {
          const quiz = await api(`/api/lms/quizzes/${quizId}`);
          const answers = {};
          const questions = quiz.questions.map((question, index) => {
            let answer;
            if (question.type === "mcq") {
              answer = el("div", { class: "options" });
              question.options.forEach((option) => {
                const input = el("input", {
                  type: "radio",
                  name: question.id,
                  value: option,
                });
                input.addEventListener("change", () => {
                  answers[question.id] = option;
                });
                answer.append(
                  el(
                    "label",
                    { class: "option" },
                    input,
                    el("span", { text: option }),
                  ),
                );
              });
            } else {
              answer = el("input", { placeholder: "Ketik jawaban singkat" });
              answer.addEventListener("input", () => {
                answers[question.id] = answer.value;
              });
            }
            return el(
              "article",
              { class: "question" },
              el("h3", { text: `${index + 1}. ${question.body}` }),
              answer,
            );
          });
          const error = el("div");
          const result = el("div");
          const dialog = modal(
            quiz.title,
            el(
              "form",
              {
                onsubmit: async (event) => {
                  event.preventDefault();
                  error.replaceChildren();
                  try {
                    const submission = await api(
                      `/api/lms/quizzes/${quizId}/submit`,
                      { method: "POST", body: JSON.stringify({ answers }) },
                    );
                    dialog.close();
                    await loadDashboard();
                    viewQuizResult(quizId);
                  } catch (err) {
                    error.append(showError(err.message));
                    if (err.message && err.message.includes("sudah pernah dikumpulkan")) {
                      setTimeout(async () => {
                        dialog.close();
                        await loadDashboard();
                        viewQuizResult(quizId);
                      }, 1000);
                    }
                  }
                },
              },
              ...questions,
              error,
              result,
              el("button", {
                class: "btn",
                type: "submit",
                text: "Kumpulkan jawaban",
              }),
            ),
          );
        } catch (err) {
          alert(err.message);
        }
      }

      async function openGame(quizId) {
        try {
          const quiz = await api(`/api/lms/quizzes/${quizId}`);
          const answers = {};
          let questionIndex = 0;
          let currentAnswer = "";
          let selectedMode = "chill";
          let timerId = null;
          let secondsLeft = 15;
          const total = quiz.questions.length;
          const progress = el("progress", {
            class: "game-progress",
            max: String(total),
            value: "0",
            "aria-label": "Progres permainan",
          });
          const step = el("p", {
            class: "game-step",
            text: `${total} soal · pilih mode bermain`,
          });
          const timer = el("p", {
            class: "game-timer",
            hidden: "",
            "aria-live": "polite",
          });
          const prompt = el("div", { class: "game-prompt" });
          const error = el("div");
          const sprintButton = el("button", {
            class: "game-mode-button",
            type: "button",
            "aria-pressed": "false",
          },
            el("strong", { text: "Sprint" }),
            el("small", { text: "15 detik per soal" }),
          );
          const chillButton = el("button", {
            class: "game-mode-button active",
            type: "button",
            "aria-pressed": "true",
          },
            el("strong", { text: "Santai" }),
            el("small", { text: "Tanpa batas waktu" }),
          );
          const modePicker = el(
            "div",
            {
              class: "game-mode-select",
              role: "group",
              "aria-label": "Pilih mode permainan",
            },
            sprintButton,
            chillButton,
          );
          const startButton = el("button", {
            class: "btn full",
            type: "button",
            text: "Mulai Santai",
          });
          const advance = el("button", {
            class: "btn",
            type: "button",
            text: "Jawab & lanjut",
          });
          advance.hidden = true;
          const dialog = modal(
            `Game belajar · ${quiz.title}`,
            el("div", {}, modePicker, startButton, progress, timer, step, prompt, error, advance),
            () => window.clearInterval(timerId),
          );

          const setMode = (mode) => {
            selectedMode = mode;
            sprintButton.classList.toggle("active", mode === "sprint");
            chillButton.classList.toggle("active", mode === "chill");
            sprintButton.setAttribute("aria-pressed", String(mode === "sprint"));
            chillButton.setAttribute("aria-pressed", String(mode === "chill"));
            startButton.textContent = mode === "sprint" ? "Mulai Sprint" : "Mulai Santai";
          };
          sprintButton.addEventListener("click", () => setMode("sprint"));
          chillButton.addEventListener("click", () => setMode("chill"));

          const stopTimer = () => {
            if (timerId !== null) {
              window.clearInterval(timerId);
              timerId = null;
            }
          };

          const renderTimer = () => {
            timer.textContent = `00:${String(secondsLeft).padStart(2, "0")}`;
            timer.classList.toggle("urgent", secondsLeft <= 5);
          };

          const finishGame = async () => {
            stopTimer();
            timer.hidden = true;
            advance.disabled = true;
            error.replaceChildren();
            try {
              const result = await api(`/api/lms/quizzes/${quizId}/submit`, {
                method: "POST",
                body: JSON.stringify({ answers }),
              });
              progress.value = total;
              step.textContent = "Tantangan selesai";
              const stars = result.score === 100 ? 3 : result.score >= 70 ? 2 : result.score > 0 ? 1 : 0;
              let streak = 0;
              let bestStreak = 0;
              quiz.questions.forEach((question) => {
                streak = result.answers[question.id]?.correct ? streak + 1 : 0;
                bestStreak = Math.max(bestStreak, streak);
              });
              prompt.replaceChildren(
                el("p", { class: "game-result-score", text: `${result.correct * 10} XP` }),
                el("p", { text: `Nilai ${result.score} · ${result.correct} dari ${result.total} jawaban benar.` }),
                el("p", { text: `Bintang: ${stars} dari 3` }),
                el("p", { text: `Combo terbaik: ${bestStreak} jawaban beruntun` }),
                el("p", { text: selectedMode === "sprint" ? "Mode Sprint selesai" : "Mode Santai selesai" }),
              );
              advance.textContent = "Kembali ke kelas";
              advance.disabled = false;
              advance.onclick = async () => {
                dialog.close();
                await loadDashboard();
              };
            } catch (err) {
              error.replaceChildren(
                showError(`${err.message} Tekan "Coba kirim lagi" untuk mengirim ulang jawaban.`),
              );
              advance.textContent = "Coba kirim lagi";
              advance.disabled = false;
              advance.onclick = async () => {
                await finishGame();
              };
            }
          };

          const advanceQuestion = async (timedOut = false) => {
            stopTimer();
            const question = quiz.questions[questionIndex];
            answers[question.id] = timedOut ? "" : currentAnswer.trim();
            questionIndex += 1;
            if (questionIndex === total) {
              await finishGame();
            } else {
              renderQuestion();
            }
          };

          const renderQuestion = () => {
            currentAnswer = "";
            error.replaceChildren();
            const question = quiz.questions[questionIndex];
            step.textContent = `Soal ${questionIndex + 1} dari ${total}`;
            progress.value = questionIndex;
            const input = question.type === "mcq"
              ? el("div", { class: "options" })
              : el("input", {
                  type: "text",
                  placeholder: "Ketik jawaban singkat",
                  "aria-label": "Jawaban",
                });
            if (question.type === "mcq") {
              question.options.forEach((option) => {
                const choice = el("input", {
                  type: "radio",
                  name: `game-${question.id}`,
                  value: option,
                });
                choice.addEventListener("change", () => {
                  currentAnswer = option;
                });
                input.append(el("label", { class: "option" }, choice, el("span", { text: option })));
              });
            } else {
              input.addEventListener("input", () => {
                currentAnswer = input.value;
              });
            }
            prompt.replaceChildren(
              el("article", { class: "question" },
                el("h3", { text: question.body }),
                input,
              ),
            );
            advance.textContent = questionIndex === total - 1 ? "Lihat hasil" : "Jawab & lanjut";
            advance.disabled = false;
            if (selectedMode === "sprint") {
              secondsLeft = 15;
              timer.hidden = false;
              renderTimer();
              timerId = window.setInterval(() => {
                secondsLeft -= 1;
                renderTimer();
                if (secondsLeft <= 0) advanceQuestion(true);
              }, 1000);
            } else {
              timer.hidden = true;
            }
          };

          startButton.addEventListener("click", () => {
            modePicker.hidden = true;
            startButton.hidden = true;
            advance.hidden = false;
            renderQuestion();
          });

          advance.addEventListener("click", async () => {
            error.replaceChildren();
            if (questionIndex >= total) return;
            if (!currentAnswer.trim()) {
              error.append(showError("Pilih atau isi jawaban terlebih dahulu."));
              return;
            }
            await advanceQuestion();
          });
        } catch (err) {
          alert(err.message);
        }
      }

      document.body.append(themeToggle());
      if (state.token) loadDashboard();
      else login();
    </script>
  </body>
